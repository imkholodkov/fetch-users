<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fetch Users</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #fafafa; color: #222; }
  #users { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
  article { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  article[data-state="error"] { border-color: #d33; }
  article[data-state="aborted"] { border-color: #e90; }
  article h2 { font-size: 1.1em; margin: 0 0 4px; }
  #summary { display: block; margin-top: 12px; font-weight: 600; }
</style>
</head>
<body>
<h4 id="login">imkholodkov</h4>

<button id="cancel" type="button">Отменить запросы</button>

<output id="summary" data-state="loading">Загрузка...</output>

<section id="users"></section>

<script>
const summary = document.getElementById('summary');
const usersSection = document.getElementById('users');
const cancelButton = document.getElementById('cancel');

function setSummary(state, text) {
  summary.dataset.state = state;
  summary.textContent = text;
}

function parseParams() {
  const params = new URLSearchParams(location.search);
  const idsRaw = params.has('ids') ? params.get('ids') : '1,2,3';
  const delayRaw = params.has('delay') ? params.get('delay') : '0';

  const parts = idsRaw.split(',').map(s => s.trim());
  if (parts.length < 1 || parts.length > 5) {
    throw new Error('Параметр ids должен содержать от 1 до 5 идентификаторов.');
  }
  const ids = parts.map(p => {
    if (!/^\d+$/.test(p) || Number(p) <= 0) {
      throw new Error(`Некорректный идентификатор «${p}»: нужны положительные целые числа через запятую.`);
    }
    return Number(p);
  });

  if (!/^\d+$/.test(delayRaw.trim()) || Number(delayRaw) > 5000) {
    throw new Error('Параметр delay должен быть целым числом от 0 до 5000.');
  }
  return { ids, delay: Number(delayRaw) };
}

async function fetchUser(id, delay, signal) {
  const response = await fetch(`https://dummyjson.com/users/${id}?delay=${delay}`, { signal });
  if (!response.ok) {
    throw new Error(`HTTP ${response.status}`);
  }
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function fillSuccess(card, user) {
  card.dataset.state = 'success';
  card.replaceChildren();
  card.append(el('h2', 'name', `${user.firstName} ${user.lastName}`));
  const email = el('a', 'email', user.email);
  email.href = `mailto:${user.email}`;
  card.append(email);
  card.append(el('span', 'city', user.address?.city ?? '—'));
  card.append(el('span', 'company', user.company?.name ?? '—'));
}

function fillFailure(card, state, message) {
  card.dataset.state = state;
  card.replaceChildren(el('span', 'message', message));
}

async function main() {
  let params;
  try {
    params = parseParams();
  } catch (err) {
    cancelButton.disabled = true;
    setSummary('error', `Некорректные параметры: ${err.message}`);
    return;
  }

  const { ids, delay } = params;
  const controller = new AbortController();
  cancelButton.addEventListener('click', () => controller.abort());

  const cards = ids.map(id => {
    const card = el('article');
    card.dataset.id = String(id);
    card.dataset.state = 'loading';
    card.append(el('span', 'message', 'Загрузка...'));
    usersSection.append(card);
    return card;
  });

  setSummary('loading', 'Загрузка...');

  const promises = ids.map((id, i) =>
    fetchUser(id, delay, controller.signal).then(user => {
      if (!controller.signal.aborted) fillSuccess(cards[i], user);
      return user;
    })
  );

  const results = await Promise.allSettled(promises);
  cancelButton.disabled = true;

  let ok = 0, failed = 0, aborted = 0;
  results.forEach((result, i) => {
    if (result.status === 'fulfilled') {
      ok++;
      fillSuccess(cards[i], result.value);
    } else if (result.reason?.name === 'AbortError') {
      aborted++;
      fillFailure(cards[i], 'aborted', 'Запрос отменён');
    } else {
      failed++;
      fillFailure(cards[i], 'error', result.reason?.message || 'Сетевая ошибка');
    }
  });

  if (aborted > 0) {
    setSummary('aborted', `Запросы отменены. Загружено: ${ok}; ошибок: ${failed}; отменено: ${aborted}`);
  } else if (failed === 0) {
    setSummary('success', `Загружено: ${ok}; ошибок: 0`);
  } else if (ok > 0) {
    setSummary('partial', `Загружено: ${ok}; ошибок: ${failed}`);
  } else {
    setSummary('error', `Загружено: 0; ошибок: ${failed}`);
  }
}

main();
</script>
</body>
</html>
