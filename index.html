<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fetch Users</title>
<style>
  :root { --bg:#f4f5fb; --card:#fff; --text:#1d2033; --muted:#6b7090; --accent:#5b5bd6; --line:#e3e5f0;
          --ok:#1f9d55; --err:#d64545; --warn:#d98a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14151f; --card:#1e2030; --text:#e8e9f3; --muted:#9a9db8; --line:#2c2f45; --accent:#8b8bf5; }
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", system-ui, sans-serif; margin: 0; padding: 32px 16px; background: var(--bg); color: var(--text); }
  .wrap { max-width: 960px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  #login { margin: 0; font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  #login::before { content: "👤 "; }
  #cancel { border: 1px solid var(--err); background: transparent; color: var(--err); padding: 8px 16px; border-radius: 999px;
            font: inherit; font-size: 14px; cursor: pointer; transition: .15s; }
  #cancel:hover:not(:disabled) { background: var(--err); color: #fff; }
  #cancel:disabled { border-color: var(--line); color: var(--muted); cursor: default; }
  #summary { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-weight: 600;
             font-size: 14px; background: var(--card); border: 1px solid var(--line); }
  #summary::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  #summary[data-state="loading"]::before { animation: pulse 1s infinite alternate; }
  #summary[data-state="success"]::before { background: var(--ok); }
  #summary[data-state="partial"]::before, #summary[data-state="aborted"]::before { background: var(--warn); }
  #summary[data-state="error"]::before { background: var(--err); }
  @keyframes pulse { to { opacity: .2; } }
  #users { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 20px; }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-height: 150px;
            display: grid; grid-template-columns: 56px 1fr; column-gap: 14px; row-gap: 4px; align-content: start;
            box-shadow: 0 2px 8px rgba(20,20,60,.06); transition: transform .15s, box-shadow .15s; }
  article:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(20,20,60,.10); }
  article > :not(.avatar) { grid-column: 2; min-width: 0; }
  .avatar { grid-row: span 4; width: 56px; height: 56px; border-radius: 50%; background: var(--bg); object-fit: cover; }
  article h2 { font-size: 17px; margin: 0 0 2px; }
  .email { color: var(--accent); text-decoration: none; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email:hover { text-decoration: underline; }
  .city, .company { font-size: 14px; color: var(--muted); }
  .city::before { content: "📍 "; }
  .company::before { content: "🏢 "; }
  article[data-state="loading"], article[data-state="error"], article[data-state="aborted"] { display: flex; align-items: center; justify-content: center; }
  article[data-state="loading"] .message { color: var(--muted); }
  article[data-state="error"] { border-color: var(--err); }
  article[data-state="error"] .message { color: var(--err); font-weight: 600; }
  article[data-state="aborted"] { border-color: var(--warn); border-style: dashed; }
  article[data-state="aborted"] .message { color: var(--warn); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
<header>
<h4 id="login">imkholodkov</h4>
<button id="cancel" type="button">Отменить запросы</button>
</header>

<output id="summary" data-state="loading">Загрузка...</output>

<section id="users"></section>
</div>

<script>
// Ссылки на элементы страницы, с которыми работает скрипт.
const summary = document.getElementById('summary');      // строка общего статуса
const usersSection = document.getElementById('users');   // контейнер для карточек
const cancelButton = document.getElementById('cancel');  // кнопка «Отменить запросы»

// Записывает в #summary состояние (атрибут data-state) и текст для пользователя.
function setSummary(state, text) {
  summary.dataset.state = state;
  summary.textContent = text;
}

// Читает параметры ids и delay из адресной строки и проверяет их.
// При ошибке бросает исключение с понятным текстом; запросы тогда не выполняются.
function parseParams() {
  // URLSearchParams разбирает часть адреса после «?», например ?ids=1,2,3&delay=0.
  const params = new URLSearchParams(location.search);
  // Тернарный оператор: если параметра нет, берём значение по умолчанию.
  const idsRaw = params.has('ids') ? params.get('ids') : '1,2,3';
  const delayRaw = params.has('delay') ? params.get('delay') : '0';

  // Разбиваем строку по запятым и убираем пробелы по краям каждого элемента.
  const parts = idsRaw.split(',').map(s => s.trim());
  if (parts.length < 1 || parts.length > 5) {
    throw new Error('Параметр ids должен содержать от 1 до 5 идентификаторов.');
  }
  // Каждый элемент должен состоять только из цифр (/^\d+$/) и быть больше нуля.
  // Так отсекаются буквы, пустые элементы («1,,2»), ноль и отрицательные числа.
  const ids = parts.map(p => {
    if (!/^\d+$/.test(p) || Number(p) <= 0) {
      throw new Error(`Некорректный идентификатор «${p}»: нужны положительные целые числа через запятую.`);
    }
    return Number(p);
  });

  // Задержка — целое число от 0 до 5000 мс.
  if (!/^\d+$/.test(delayRaw.trim()) || Number(delayRaw) > 5000) {
    throw new Error('Параметр delay должен быть целым числом от 0 до 5000.');
  }
  return { ids, delay: Number(delayRaw) };
}

// Загружает одного пользователя. Возвращает промис с объектом пользователя.
// signal — сигнал AbortController: по нему fetch прерывается при отмене.
async function fetchUser(id, delay, signal) {
  const response = await fetch(`https://dummyjson.com/users/${id}?delay=${delay}`, { signal });
  // fetch не отклоняет промис при статусе 404 или 500 — проверяем response.ok сами
  // и превращаем ошибочный статус в отклонение с текстом вида «HTTP 404».
  if (!response.ok) {
    throw new Error(`HTTP ${response.status}`);
  }
  // Тело успешного ответа читаем как JSON.
  return response.json();
}

// Вспомогательная функция: создаёт элемент с классом и текстом.
// Текст ставится через textContent, а не innerHTML, — так данные из сети
// не могут превратиться в HTML-разметку на странице.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// Заполняет карточку данными успешно загруженного пользователя.
function fillSuccess(card, user) {
  card.dataset.state = 'success';
  card.replaceChildren(); // убираем «Загрузка...»
  // Аватар — адрес картинки из ответа сервера.
  if (user.image) {
    const avatar = el('img', 'avatar');
    avatar.src = user.image;
    avatar.alt = '';
    card.append(avatar);
  }
  card.append(el('h2', 'name', `${user.firstName} ${user.lastName}`));
  // Ссылка на почту: href вида mailto:адрес.
  const email = el('a', 'email', user.email);
  email.href = `mailto:${user.email}`;
  card.append(email);
  // ?. — не падать, если поля address или company нет; ?? — подставить «—» вместо пустого значения.
  card.append(el('span', 'city', user.address?.city ?? '—'));
  card.append(el('span', 'company', user.company?.name ?? '—'));
}

// Заполняет карточку неудачного или отменённого запроса: state — 'error' или 'aborted'.
function fillFailure(card, state, message) {
  card.dataset.state = state;
  card.replaceChildren(el('span', 'message', message));
}

// Главная функция: проверка параметров, параллельные запросы, вывод результата.
async function main() {
  // 1. Проверяем параметры. При ошибке показываем сообщение и выходим без запросов.
  let params;
  try {
    params = parseParams();
  } catch (err) {
    cancelButton.disabled = true;
    setSummary('error', `Некорректные параметры: ${err.message}`);
    return;
  }

  // 2. Один AbortController на все запросы: кнопка отмены прерывает их разом.
  const { ids, delay } = params;
  const controller = new AbortController();
  cancelButton.addEventListener('click', () => controller.abort());

  // 3. Сразу создаём карточки-заготовки в порядке ids. Позже заполняем их по индексу,
  //    поэтому порядок карточек не зависит от того, какой запрос ответит первым.
  const cards = ids.map(id => {
    const card = el('article');
    card.dataset.id = String(id);
    card.dataset.state = 'loading';
    card.append(el('span', 'message', 'Загрузка...'));
    usersSection.append(card);
    return card;
  });

  setSummary('loading', 'Загрузка...');

  // 4. Запускаем все запросы одновременно: map вызывает fetchUser для каждого id
  //    без await, поэтому запросы идут параллельно. Каждая карточка заполняется,
  //    как только пришёл её ответ.
  const promises = ids.map((id, i) =>
    fetchUser(id, delay, controller.signal).then(user => {
      if (!controller.signal.aborted) fillSuccess(cards[i], user);
      return user;
    })
  );

  // 5. Promise.allSettled ждёт завершения всех промисов и не прерывается на первой
  //    ошибке. Для каждого возвращает {status: 'fulfilled', value} или {status: 'rejected', reason}.
  const results = await Promise.allSettled(promises);
  cancelButton.disabled = true;

  // 6. Считаем успехи, ошибки и отмены и окончательно оформляем каждую карточку.
  let ok = 0, failed = 0, aborted = 0;
  results.forEach((result, i) => {
    if (result.status === 'fulfilled') {
      ok++;
      fillSuccess(cards[i], result.value);
    } else if (result.reason?.name === 'AbortError') {
      // Отмена через controller.abort() отклоняет fetch ошибкой с именем AbortError —
      // так отмена отличается от сетевой или HTTP-ошибки.
      aborted++;
      fillFailure(cards[i], 'aborted', 'Запрос отменён');
    } else {
      failed++;
      fillFailure(cards[i], 'error', result.reason?.message || 'Сетевая ошибка');
    }
  });

  // 7. Итоговое состояние всей операции в #summary.
  if (aborted > 0) {
    setSummary('aborted', `Запросы отменены. Загружено: ${ok}; ошибок: ${failed}; отменено: ${aborted}`);
  } else if (failed === 0) {
    setSummary('success', `Загружено: ${ok}; ошибок: 0`);
  } else if (ok > 0) {
    setSummary('partial', `Загружено: ${ok}; ошибок: ${failed}`);
  } else {
    setSummary('error', `Загружено: 0; ошибок: ${failed}`);
  }
}

main();
</script>
</body>
</html>
